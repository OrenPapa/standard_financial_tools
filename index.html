<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Financial Tools</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('financial-tools-theme') || 'blue';
        if (['blue', 'light', 'dark'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        document.documentElement.dataset.theme = 'blue';
      }
    })();
  </script>
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="min-h-screen text-slate-100 antialiased">
  <div id="appLoader" class="app-loader" aria-live="polite" aria-label="Loading financial tools">
    <div class="app-loader-mark"></div>
    <div class="app-loader-text">Loading</div>
  </div>
  <main class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-5 sm:px-6 lg:px-8">
    <header class="flex flex-col gap-3 border-b border-white/10 pb-5">
      <div class="header-top flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p id="featureEyebrow" class="text-sm font-medium text-emerald-300">Financial Tools</p>
          <h1 id="featureTitle" class="mt-1 text-2xl font-semibold tracking-tight text-white sm:text-3xl">Pension Accumulation & Drawdown</h1>
        </div>
        <div id="authShell"></div>
      </div>
      <div class="header-actions flex flex-wrap items-center gap-2">
        <div id="moduleTabs" class="inline-flex w-fit rounded-md border border-white/10 bg-slate-900/70 p-0.5 shadow-xl shadow-slate-950/20"></div>
      </div>
    </header>

    <section id="appLayout" class="app-layout grid gap-6 lg:grid-cols-[360px_minmax(0,1fr)]">
      <aside id="controlsPanel" class="controls-panel h-fit rounded-lg border border-white/10 bg-slate-900/80 p-4 shadow-2xl shadow-slate-950/20">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-white">Controls</h2>
          <button id="resetBtn" class="rounded-md border border-white/10 px-3 py-1.5 text-sm text-slate-200 hover:bg-white/10">Reset</button>
        </div>
        <div id="moduleExtraControls"></div>
        <div id="controls" class="space-y-4"></div>
      </aside>

      <div class="results-panel space-y-6">
        <section id="comparisonBuilder" class="hidden rounded-lg border border-white/10 bg-slate-900/80 p-4 shadow-2xl shadow-slate-950/20"></section>
        <section id="kpiGrid" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-5"></section>

        <section id="chartSection" class="relative rounded-lg border border-white/10 bg-slate-900/80 p-4 shadow-2xl shadow-slate-950/20">
          <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
            <div>
              <h2 id="chartTitle" class="font-semibold text-white">Annual Portfolio Growth</h2>
              <p id="chartSubtitle" class="text-sm text-slate-400">Principal, interest, and net balance after tax</p>
            </div>
            <div id="chartTabs" class="inline-flex w-fit rounded-lg border border-white/10 bg-slate-950/70 p-1"></div>
          </div>
          <div id="primaryChartPanel" class="chart-box"><canvas id="primaryChart"></canvas></div>
          <div id="chartLoader" class="result-loader hidden" aria-live="polite" aria-label="Updating chart">
            <span class="result-loader-spinner" aria-hidden="true"></span>
            <span>Updating...</span>
          </div>
        </section>

        <details open class="rounded-lg border border-white/10 bg-slate-900/80 shadow-2xl shadow-slate-950/20">
          <summary class="flex cursor-pointer items-center justify-between px-4 py-3">
            <span id="tableTitle" class="font-semibold text-white">Annual Accumulation Schedule</span>
            <span class="schedule-chevron" aria-hidden="true"></span>
          </summary>
          <div id="tableColumnControls" class="table-column-controls border-t border-white/10 px-4 py-3"></div>
          <div id="scheduleScroll" class="schedule-scroll relative border-t border-white/10">
            <table class="min-w-full text-left text-sm">
              <thead id="scheduleHead" class="sticky top-0 z-10 bg-slate-900 text-xs uppercase tracking-wider text-slate-400"></thead>
              <tbody id="scheduleBody" class="divide-y divide-white/10"></tbody>
            </table>
            <div id="scheduleLoader" class="result-loader hidden" aria-live="polite" aria-label="Updating schedule">
              <span class="result-loader-spinner" aria-hidden="true"></span>
              <span>Updating...</span>
            </div>
          </div>
        </details>
      </div>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
