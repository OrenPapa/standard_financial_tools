<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Login | Financial Tools</title>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('financial-tools-theme') || 'blue';
        if (['blue', 'light', 'dark'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        document.documentElement.dataset.theme = 'blue';
      }
    })();
  </script>
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="min-h-screen text-slate-100 antialiased">
  <div id="devServerNotice" style="display:none;max-width:44rem;margin:2rem auto;padding:1rem;border:1px solid #f59e0b;border-radius:0.5rem;background:#111827;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5">
    This source page needs the Vite dev server. Run <code>pnpm dev</code> and open <code>http://127.0.0.1:5173/login.html</code>.
  </div>
  <main class="auth-page flex min-h-screen w-full items-center justify-center px-4 py-6 sm:px-6">
    <section class="auth-card" aria-label="Authentication">
      <a class="auth-back-link" href="./index.html">
        <svg class="auth-button-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>Continue as Guest</span>
      </a>

      <div id="authSignedOut">
        <div class="auth-segment" role="tablist" aria-label="Authentication mode">
          <button id="authLoginTab" class="auth-segment-tab is-active" type="button" role="tab" aria-selected="true">Login</button>
          <button id="authRegisterTab" class="auth-segment-tab" type="button" role="tab" aria-selected="false">Register</button>
        </div>

        <form id="authForm" class="auth-page-form" autocomplete="on" novalidate>
          <label class="auth-field">
            <span>Email</span>
            <input id="authEmail" class="auth-input auth-page-input" name="email" type="email" autocomplete="email" placeholder="name@example.com" required aria-describedby="authEmailError">
            <span id="authEmailError" class="auth-field-error" aria-live="polite"></span>
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="authPassword" class="auth-input auth-page-input" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="8" aria-describedby="authPasswordError">
            <span id="authPasswordError" class="auth-field-error" aria-live="polite"></span>
          </label>
          <label class="auth-field hidden">
            <span>Confirm password</span>
            <input id="authConfirmPassword" class="auth-input auth-page-input" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repeat your password" minlength="8" aria-describedby="authConfirmPasswordError authPasswordHint">
            <span id="authConfirmPasswordError" class="auth-field-error" aria-live="polite"></span>
            <span id="authPasswordHint" class="auth-password-hint">Suggestion: Use 8+ characters with a capital letter, numbers and symbols.</span>
          </label>

          <div class="auth-form-actions">
            <a id="authForgotPassword" class="auth-forgot-link" href="#" aria-disabled="true">Forgot password?</a>
            <button id="authSubmitBtn" class="auth-button auth-button-primary auth-page-submit" type="submit">Login</button>
          </div>

          <div class="auth-provider-row" aria-label="Social sign in options">
            <button class="auth-provider-button" type="button" disabled aria-label="Google sign in coming later">
              <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.8 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2a9.7 9.7 0 0 0 3.1-7.4z"></path>
                <path d="M12 22a9.5 9.5 0 0 0 6.7-2.4L15.5 17a6 6 0 0 1-9-3.2H3.2v2.7A10 10 0 0 0 12 22z"></path>
                <path d="M6.5 13.8a6 6 0 0 1 0-3.6V7.5H3.2a10 10 0 0 0 0 9z"></path>
                <path d="M12 6a5.4 5.4 0 0 1 3.8 1.5l2.9-2.9A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.8 5.5l3.3 2.7A6 6 0 0 1 12 6z"></path>
              </svg>
            </button>
            <button class="auth-provider-button" type="button" disabled aria-label="Apple sign in coming later">
              <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16.4 13.1c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.9-3.6 2.2-1.5 2.7-.4 6.7 1.1 8.9.7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 3 .7 1.2 0 2-1.1 2.8-2.2.8-1.3 1.2-2.5 1.2-2.5 0-.1-2.8-1.1-2.8-3.5z"></path>
                <path d="M14.2 6.5c.6-.8 1.1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.8-.9 2.9 1 .1 2-.5 2.6-1.3z"></path>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <div id="authRedirectLoader" class="auth-redirect-loader hidden" aria-live="polite">
        <span class="result-loader-spinner" aria-hidden="true"></span>
        <span>Loading account...</span>
      </div>
      <p id="authMessage" class="auth-message auth-page-message" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./src/login.js"></script>
  <script>
    window.setTimeout(() => {
      const form = document.getElementById('authForm');
      const notice = document.getElementById('devServerNotice');
      const stylesApplied = getComputedStyle(document.body).backgroundImage !== 'none';
      if (notice && form && !stylesApplied) {
        notice.style.display = 'block';
      }
    }, 1500);
  </script>
</body>
</html>
